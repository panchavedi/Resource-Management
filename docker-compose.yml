# Local stack: PostgreSQL + Spring Boot API + Next.js web app (+ optional Ollama).
#   cp .env.example .env        # then adjust values
#   docker compose up --build   # http://localhost:3000
# Ollama on the host is used by default (OLLAMA_BASE_URL=http://host.docker.internal:11434).
# To run Ollama in a container instead:  docker compose --profile ollama up --build
name: talent-management

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: talent_management
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 avoids clashing with a locally installed PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d talent_management"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/talent_management
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_MANAGER_PASSWORD: ${APP_MANAGER_PASSWORD:-}
      APP_APPROVER_PASSWORD: ${APP_APPROVER_PASSWORD:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      AI_MODE: ${AI_MODE:-AUTO}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-240s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # First run: docker compose exec ollama ollama pull qwen2.5-coder:7b
    # and set OLLAMA_DOCKER_URL=http://ollama:11434 in .env

volumes:
  postgres-data:
  ollama-models:
