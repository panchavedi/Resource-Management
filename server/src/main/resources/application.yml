# =====================================================================================
# Talent Management – configuration. Every environment-specific value is an environment
# variable; local values can live in ../.env or ./.env (git-ignored, see .env.example).
# =====================================================================================
spring:
  application:
    name: talent-management
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talent_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
        order_inserts: true
  flyway:
    # db/seed adds synthetic demo data; remove it from FLYWAY_LOCATIONS for a clean database.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
  data:
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allocation:
    max-capacity-percent: ${MAX_CAPACITY_PERCENT:100}
    four-eyes-approval: ${FOUR_EYES_APPROVAL:true}
  matching:
    mandatory-skill-policy: ${MANDATORY_SKILL_POLICY:EXCLUDE}
    evidence-freshness-months: 18
    weights:
      skill: 0.50
      availability: 0.30
      location: 0.15
      evidence: 0.05
  ai:
    mode: ${AI_MODE:AUTO}
    max-candidates: 3
    max-llm-attempts: 2
    narration-budget: ${AI_NARRATION_BUDGET:150s}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
      connect-timeout: 3s
      read-timeout: ${OLLAMA_READ_TIMEOUT:240s}
      temperature: 0.1
      context-window: 4096
      keep-alive: 30m
      warm-up-on-startup: true
  security:
    jwt-secret: ${JWT_SECRET:}
    issuer: talent-management
    token-ttl: 8h
    max-login-attempts: 5
    lock-duration: 5m
    users:
      - username: manager
        display-name: Riya Menon (Resource Manager)
        password: ${APP_MANAGER_PASSWORD:}
        roles: [RESOURCE_MANAGER]
      - username: approver
        display-name: Arjun Rao (Delivery Head)
        password: ${APP_APPROVER_PASSWORD:}
        roles: [APPROVER]
      - username: admin
        display-name: Platform Admin
        password: ${APP_ADMIN_PASSWORD:}
        roles: [ADMIN]

logging:
  level:
    com.talent.server: INFO
    org.hibernate.SQL: WARN
